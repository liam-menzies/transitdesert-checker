<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transit Desert Checker (MBTA + RIPTA)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: Arial, sans-serif; margin: 2rem; max-width: 800px; }
  input, button { padding: 0.6rem; font-size: 1rem; margin-top: 0.5rem; }
  button { cursor: pointer; }
  .warning { font-weight: bold; color: darkred; margin-top: 1rem; }
  .good { font-weight: bold; color: darkgreen; margin-top: 1rem; }
  ol { margin-top: 1rem; }
</style>
</head>
<body>

<h1>Transit Desert Checker</h1>
<p>Checks MBTA (MA) and RIPTA (RI) transit access.</p>

<input type="text" id="address" placeholder="Enter an address" size="40">
<br>
<button onclick="checkTransit()">Check Transit Access</button>

<div id="result"></div>

<script>
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
    Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function modeName(type) {
  return ["Light Rail / Subway","Heavy Rail","Commuter Rail","Bus","Ferry"][type] || "Other";
}

async function fetchRoutes(apiBase, stopId, vehicleType) {
  const r = await fetch(`${apiBase}/routes?filter[stop]=${stopId}`);
  const d = await r.json();
  if (!d.data?.length) return "No route info";

  if (vehicleType === 3) {
    return d.data.map(r =>
      r.attributes.long_name
        ? `${r.attributes.short_name} (${r.attributes.long_name})`
        : r.attributes.short_name
    ).join(", ");
  }

  if (vehicleType === 2) {
    const cr = d.data.find(r => r.attributes.type === 2);
    return cr ? `${cr.attributes.long_name} (CR)` : "Commuter Rail";
  }

  return d.data.map(r =>
    r.attributes.long_name || r.attributes.short_name
  ).join(", ");
}

async function fetchStops(apiBase, agency, lat, lon) {
  const r = await fetch(
    `${apiBase}/stops?filter[latitude]=${lat}&filter[longitude]=${lon}&filter[radius]=5`
  );
  const d = await r.json();
  return d.data.map(s => ({ stop: s, agency }));
}

async function checkTransit() {
  const addr = document.getElementById("address").value.trim();
  const result = document.getElementById("result");
  result.textContent = "Loading…";
  if (!addr) return;

  const geo = await fetch(
    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}`
  ).then(r => r.json());
  if (!geo.length) {
    result.textContent = "Address not found.";
    return;
  }

  const lat = +geo[0].lat;
  const lon = +geo[0].lon;

  const mbtaStops = await fetchStops("https://api-v3.mbta.com","MBTA",lat,lon);
  const riptaStops = await fetchStops("https://api-v3.ripta.com","RIPTA",lat,lon);

  const allStops = [...mbtaStops, ...riptaStops].map(o => ({
    ...o,
    distKm: haversine(lat,lon,o.stop.attributes.latitude,o.stop.attributes.longitude)
  }));

  const seen = new Set();
  const unique = [];
  for (const s of allStops) {
    const parent = s.stop.relationships?.parent_station?.data?.id;
    const key = `${s.agency}-${parent || s.stop.id}`;
    if (!seen.has(key)) {
      unique.push(s);
      seen.add(key);
    }
  }

  unique.sort((a,b) => a.distKm - b.distKm);
  const top3 = unique.slice(0,3);

  for (const s of top3) {
    s.routes = await fetchRoutes(
      s.agency === "MBTA"
        ? "https://api-v3.mbta.com"
        : "https://api-v3.ripta.com",
      s.stop.id,
      s.stop.attributes.vehicle_type
    );
  }

  let html = "";
  if (top3[0].distKm > 1.5) {
    html += `<div class="warning">You are in a transit desert.</div>`;
  } else {
    html += `<div class="good">You have reasonable transit access.</div>`;
  }

  html += "<ol>";
  for (const s of top3) {
    html += `<li>
      ${s.stop.attributes.name}
      — ${(s.distKm*1000).toFixed(0)} m away
      — ${modeName(s.stop.attributes.vehicle_type)}
      — ${s.routes}
      — ${s.agency}
    </li>`;
  }
  html += "</ol>";

  result.innerHTML = html;
}
</script>

</body>
</html>
